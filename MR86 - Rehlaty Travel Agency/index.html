<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rehlaty Travel - demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.hero{text-align:center;padding:60px 40px;max-width:650px}
.badge{display:inline-block;padding:6px 18px;border-radius:20px;font-size:0.8em;font-weight:600;background:#38bdf822;color:#38bdf8;border:1px solid #38bdf844;margin-bottom:28px}
h1{font-size:2.4em;font-weight:700;color:#fff;margin-bottom:16px}
p{color:#9a9a9a;font-size:1.1em;line-height:1.7;margin-bottom:40px}
.status{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:12px;background:#1a1a1a;border:1px solid #2e2e2e;font-size:0.9em;color:#6b6b6b}
.dot{width:8px;height:8px;border-radius:50%;background:#fbbf24;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
</style>
</head>
<body>
<div class="hero">
<div class="badge">سياحة</div>
<h1>Rehlaty Travel</h1>
<p>رحلتى سفر وحجوزات</p>
<div class="status"><span class="dot"></span> Coming Soon</div>
</div>
</body>
</html>
